[project]
name = "kleptography"
version = "0.1.0"
description = "An open-source educational project for studying and demonstrating kleptographic techniques."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Daniel Pérez Ruiz", email = "danielperezruiz.pro@gmail.com" },
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
    "ruff>=0.8",
    "ty>=0.0.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.pytest.ini_options]
testpaths = ["tests"]