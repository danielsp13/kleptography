[project]
name = "kleptography"
version = "1.0.0"
description = "An open-source educational project for studying and demonstrating kleptographic techniques."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Daniel Pérez Ruiz", email = "danielperezruiz.pro@gmail.com" },
]
dependencies = [
    "cryptography>=50.0.1",
    "jinja2>=3.1",
    "streamlit>=1.63.0",
    "sympy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
    "ruff>=0.8",
    "ty>=0.0.1",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "D",
    "E",
    "F",
    "I",
]
# Magic methods and __init__ document themselves through their class.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/kleptography"]

[tool.coverage.report]
show_missing = true
skip_empty = true
